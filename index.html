<title>每日工作流程</title>
<style>
:root{
  --bg:#f7dfe7;
  --card:#fffdfd;
  --ink:#1f2530;
  --muted:#7b7f88;
  --blue:#294f9b;
  --blue2:#e8eefc;
  --line:#e6d9de;
  --ok:#4c7a5e;
  --scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
body{font-size:calc(16px * var(--scale));padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit}
.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 100px}
header{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
.logo{width:56px;height:56px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 16px #0002;flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover}
.kicker{font-weight:800;color:#6d6f78;font-size:.85em;letter-spacing:1.5px}
h1{margin:2px 0 0;font-size:1.85em;line-height:1.05}
.header-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{border:0;background:#fff8fb;border:1px solid #e5cdd6;border-radius:13px;padding:9px 11px;font-weight:800;color:#39435a}

.summary{background:var(--blue);color:white;border-radius:26px;padding:22px;box-shadow:0 12px 26px #294f9b26}
.summary-top{display:flex;justify-content:space-between;gap:18px;align-items:center}
.date{font-size:1.05em;font-weight:800}
.name-label{margin-top:16px;color:#d9e2fb;font-weight:800}
.name-input{width:100%;margin-top:7px;background:transparent;border:0;border-bottom:1px solid #9eb1dc;color:#fff;padding:9px 0;font-size:1.25em;outline:none}
.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),#5472ad 0);position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:11px;background:var(--blue);border-radius:50%}
.ring-inner{z-index:1;text-align:center}
.ring-inner b{font-size:1.65em}
.ring-inner small{display:block;color:#d8e2f8;margin-top:3px}
.next{border-top:4px solid #5c78b0;margin-top:20px;padding-top:14px;color:#e7edfb}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 4px 12px}
.toolbar h2{margin:0;font-size:1.55em}
.badge{font-size:.78em;letter-spacing:1.4px;font-weight:800;color:#6d6f78}
.btn{border:1px solid #dfcbd3;background:#fff9fb;padding:10px 13px;border-radius:13px;font-weight:800;color:#374056}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 18px}
.tab{border:1px solid #dcc7cf;background:#fff9fb;padding:11px 7px;border-radius:14px;font-weight:800;font-size:1em}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab:nth-child(1),.tab:nth-child(2),.tab:nth-child(3){grid-column:span 2}
.tab:nth-child(4),.tab:nth-child(5){grid-column:span 3}

.section-title{margin:18px 4px 10px;color:#6d6f78;font-weight:900;display:flex;align-items:center;gap:10px}
.section-title:after{content:"";height:1px;background:#dac8cf;flex:1}

.task{background:var(--card);border:1px solid #eadde2;border-radius:20px;margin:10px 0;padding:17px 15px;display:grid;grid-template-columns:48px 1fr 46px;gap:10px;align-items:center;box-shadow:0 3px 10px #0000000c}
.task.current{border-color:#9fb0df;box-shadow:0 0 0 2px #9fb0df35,0 4px 14px #0001}
.num{font-weight:900;color:#96919a}
.task-title{font-size:1.18em;font-weight:900}
.note{color:#7f7d84;margin-top:5px;font-size:.92em;white-space:pre-wrap}
.check{width:40px;height:40px;border-radius:13px;border:3px solid #c9c7d0;background:#fff;display:grid;place-items:center;font-size:1.35em;cursor:pointer}
.task.done{opacity:.58}
.task.done .task-title{text-decoration:line-through}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task-menu{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.small{font-size:.82em;padding:8px 11px;border-radius:10px;border:1px solid #ddd2d8;background:#fff}
.empty{text-align:center;color:#8a838a;padding:34px}

.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--blue);color:#fff;font-size:1.8em;box-shadow:0 10px 24px #294f9b4d}
.fab.hidden{display:none}

.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:#fffafd;width:100%;max-width:760px;margin:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:1.45em}
.field{margin:12px 0}
.field label{display:block;font-size:.85em;font-weight:900;color:#6f6b72;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;font-size:1em;padding:13px 12px;border:1px solid #d9cbd1;border-radius:13px;background:#fff}
.field textarea{min-height:90px}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .btn{flex:1;padding:13px}
.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.danger{background:#fff3f3;color:#a23c3c;border-color:#efc7c7}
.help{font-size:.82em;color:#79747c;margin:8px 2px}
.admin-only{display:none}
.admin .admin-only{display:inline-flex}
.admin .task-menu.admin-only{display:flex}
.status{font-size:.8em;color:#776f77;margin-top:8px}
.font-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.font-choice button{padding:12px;border:1px solid #dccbd2;border-radius:12px;background:#fff}
.font-choice button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

@media(min-width:700px){
  .app{padding-top:28px}
  .fab{right:calc((100vw - 760px)/2 + 24px)}
  .task{padding:20px}
}
</style>
</head>
<body>

  <div>
    <div class="kicker">工作流程小幫手</div>
    <h1>每日工作流程</h1>
  </div>
  <div class="header-actions">
    <button class="iconbtn" id="fontBtn" aria-label="字體大小" title="字體大小">Aa</button>
    <button class="iconbtn" id="adminBtn" aria-label="管理模式" title="管理模式">⚙️</button>
  </div>
</header>

<section class="summary">
  <div class="summary-top">
    <div style="flex:1">
      <div class="date" id="dateText"></div>
      <div class="name-label">執行人</div>
      <input class="name-input" id="personName" placeholder="輸入姓名">
    </div>
    <div class="ring" id="ring" style="--p:0%">
      <div class="ring-inner"><b id="percent">0%</b><small id="count">0 / 0</small></div>
    </div>
  </div>
  <div class="next" id="nextTask">下一項：—</div>
</section>

<div class="toolbar">
  <div><div class="badge" id="itemsLabel">SOP · 0 ITEMS</div><h2>照順序完成</h2></div>
  <div><button class="btn" id="resetBtn">重設勾選</button></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="daily">🐷 每日</button>
  <button class="tab" data-tab="monthly">🐷 每月</button>
  <button class="tab" data-tab="yearly">🐷 每年</button>
  <button class="tab" data-tab="vendor">🐷 廠商帳務</button>
  <button class="tab" data-tab="adhoc">🐷 不定期</button>
</div>

<div class="section-title">工作項目</div>
<div id="taskList"></div>
<div class="help" id="helpText">提示：點右上角「管理」可進入管理模式。</div>
<div class="status" id="modeStatus">目前：使用模式</div>
</div>

<button class="fab hidden admin-only" id="addBtn">＋</button>

<div class="modal" id="taskModal">
  <div class="sheet">
    <h3 id="modalTitle">新增工作</h3>
    <div class="field"><label>工作名稱</label><input id="taskTitleInput" placeholder="例如：上班打卡"></div>
    <div class="field"><label>備註 / 交接說明</label><textarea id="taskNoteInput" placeholder="例如：刷點 APP、注意事項、系統位置"></textarea></div>
    <div class="field"><label>分類</label>
      <select id="taskTypeInput">
        <option value="daily">每日</option>
        <option value="monthly">每月</option>
        <option value="yearly">每年</option>
        <option value="vendor">廠商帳務</option>
        <option value="adhoc">不定期</option>
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="sheet">
    <h3>管理模式</h3>
    <div class="field"><label>管理密碼</label><input id="adminPassword" type="password" placeholder="輸入管理密碼"></div>
    <div class="help">第一次使用預設密碼：<b>lulu1688</b>。進入後可自行修改。</div>
    <div class="sheet-actions">
      <button class="btn" id="adminCancel">取消</button>
      <button class="btn primary" id="adminLogin">進入管理</button>
    </div>
  </div>
</div>

<div class="modal" id="fontModal">
  <div class="sheet">
    <h3>字體大小</h3>
    <div class="font-choice">
      <button data-size="small">小</button>
      <button data-size="normal">標準</button>
      <button data-size="large">大</button>
    </div>
    <div class="sheet-actions"><button class="btn primary" id="fontClose">完成</button></div>
  </div>
</div>

<script>
const fallbackDefaults = {
  daily:[
    {title:"上班打卡",note:"刷點 APP",done:false},
    {title:"檢查凍庫電源",note:"",done:false},
    {title:"查看今日大車到貨擺放位子",note:"左邊全空（除週二）",done:false},
    {title:"拿司機出貨本上樓",note:"",done:false}
  ],
  monthly:[
    {title:"每月工作紀錄整理",note:"彙整本月完成事項",done:false},
    {title:"下月工作預排",note:"",done:false}
  ],
  yearly:[],
  vendor:[],
  adhoc:[]
};

function migrateOld(){
  let old=null;
  try{ old=JSON.parse(localStorage.getItem("workflow_v1")||"null"); }catch(e){}
  if(!old) return fallbackDefaults;
  return {
    daily:Array.isArray(old.daily)?old.daily:[],
    monthly:Array.isArray(old.monthly)?old.monthly:[],
    yearly:Array.isArray(old.yearly)?old.yearly:[],
    vendor:Array.isArray(old.vendor)?old.vendor:[],
    adhoc:Array.isArray(old.adhoc)?old.adhoc:[]
  };
}

let data = (()=>{try{return JSON.parse(localStorage.getItem("workflow_v3")||"null")||migrateOld()}catch(e){return migrateOld()}})();
let current = localStorage.getItem("workflow_tab_v3") || "daily";
if(!data[current]) current="daily";
let editIndex = null;
let adminMode = sessionStorage.getItem("workflow_admin")==="1";
const $ = id => document.getElementById(id);

function save(){
  localStorage.setItem("workflow_v3",JSON.stringify(data));
}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function labelFor(tab){
  return {daily:"每日",monthly:"每月",yearly:"每年",vendor:"廠商帳務",adhoc:"不定期"}[tab]||"SOP";
}
function render(){
  document.body.classList.toggle("admin",adminMode);
  $("addBtn").classList.toggle("hidden",!adminMode);
  $("modeStatus").textContent=adminMode?"目前：管理模式（可新增、編輯、刪除、排序）":"目前：使用模式";
  $("helpText").textContent=adminMode?"提示：管理模式可編輯交接內容；完成後按右上角「管理」退出。":"提示：可查看內容、勾選完成；要修改 SOP 請進入管理模式。";
  $("adminBtn").textContent="⚙️"; $("adminBtn").title=adminMode?"退出管理模式":"進入管理模式";

  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===current));
  const arr=data[current]||[];
  const done=arr.filter(x=>x.done).length;
  const pct=arr.length?Math.round(done/arr.length*100):0;
  $("percent").textContent=pct+"%";
  $("count").textContent=`${done} / ${arr.length}`;
  $("ring").style.setProperty("--p",pct+"%");
  $("itemsLabel").textContent=`${labelFor(current)} SOP · ${arr.length} ITEMS`;
  const next=arr.find(x=>!x.done);
  $("nextTask").textContent="下一項："+(next?next.title:"全部完成 🎉");
  const list=$("taskList");
  if(!arr.length){list.innerHTML='<div class="empty">目前沒有工作項目。</div>';return;}
  const firstOpen=arr.findIndex(x=>!x.done);
  list.innerHTML=arr.map((t,i)=>`
    <div class="task ${t.done?"done":""} ${i===firstOpen?"current":""}">
      <div class="num">${String(i+1).padStart(2,"0")}</div>
      <div><div class="task-title">${esc(t.title)}</div>${t.note?`<div class="note">${esc(t.note)}</div>`:""}</div>
      <button class="check" onclick="toggle(${i})">${t.done?"✓":""}</button>
      ${adminMode?`<div class="task-menu">
        <button class="small" onclick="editTask(${i})">編輯</button>
        <button class="small" onclick="moveTask(${i},-1)">↑</button>
        <button class="small" onclick="moveTask(${i},1)">↓</button>
        <button class="small" onclick="deleteTask(${i})">刪除</button>
      </div>`:""}
    </div>`).join("");
}
window.toggle=i=>{data[current][i].done=!data[current][i].done;save();render();}
window.moveTask=(i,d)=>{
  if(!adminMode)return;
  const a=data[current],j=i+d;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];save();render();
}
window.deleteTask=i=>{
  if(!adminMode)return;
  if(confirm("確定刪除這個工作項目嗎？")){data[current].splice(i,1);save();render();}
}
function openTaskModal(){ $("taskModal").classList.add("show"); }
function closeTaskModal(){ $("taskModal").classList.remove("show"); editIndex=null; }
window.editTask=i=>{
  if(!adminMode)return;
  editIndex=i;const t=data[current][i];
  $("modalTitle").textContent="編輯工作";
  $("taskTitleInput").value=t.title;
  $("taskNoteInput").value=t.note||"";
  $("taskTypeInput").value=current;
  openTaskModal();
}
$("addBtn").onclick=()=>{
  if(!adminMode)return;
  editIndex=null;$("modalTitle").textContent="新增工作";
  $("taskTitleInput").value="";$("taskNoteInput").value="";$("taskTypeInput").value=current;openTaskModal();
};
$("cancelBtn").onclick=closeTaskModal;
$("taskModal").onclick=e=>{if(e.target===$("taskModal"))closeTaskModal();}
$("saveBtn").onclick=()=>{
  if(!adminMode)return;
  const title=$("taskTitleInput").value.trim();
  if(!title){alert("請輸入工作名稱");return;}
  const note=$("taskNoteInput").value.trim(),type=$("taskTypeInput").value;
  if(editIndex===null) data[type].push({title,note,done:false});
  else{
    const old=data[current][editIndex];
    if(type===current) data[current][editIndex]={...old,title,note};
    else{data[current].splice(editIndex,1);data[type].push({...old,title,note});}
  }
  save();current=type;localStorage.setItem("workflow_tab_v3",current);closeTaskModal();render();
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.tab;localStorage.setItem("workflow_tab_v3",current);render();});
$("resetBtn").onclick=()=>{if(confirm("要把目前這一頁的勾選全部清除嗎？")){data[current].forEach(x=>x.done=false);save();render();}};
$("personName").value=localStorage.getItem("workflow_person")||"";
$("personName").oninput=e=>localStorage.setItem("workflow_person",e.target.value);

function getAdminPassword(){return localStorage.getItem("workflow_admin_password")||"lulu1688";}
$("adminBtn").onclick=()=>{
  if(adminMode){adminMode=false;sessionStorage.removeItem("workflow_admin");render();return;}
  $("adminPassword").value="";$("adminModal").classList.add("show");
};
$("adminCancel").onclick=()=> $("adminModal").classList.remove("show");
$("adminModal").onclick=e=>{if(e.target===$("adminModal"))$("adminModal").classList.remove("show");}
$("adminLogin").onclick=()=>{
  if($("adminPassword").value===getAdminPassword()){
    adminMode=true;sessionStorage.setItem("workflow_admin","1");$("adminModal").classList.remove("show");render();
  }else alert("管理密碼不正確");
};

const scales={small:.90,normal:1,large:1.16};
function applyFont(size){
  const s=scales[size]?size:"normal";
  document.documentElement.style.setProperty("--scale",scales[s]);
  localStorage.setItem("workflow_font_size",s);
  document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("active",b.dataset.size===s));
}
$("fontBtn").onclick=()=>{$("fontModal").classList.add("show");applyFont(localStorage.getItem("workflow_font_size")||"normal");};
document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>applyFont(b.dataset.size));
$("fontClose").onclick=()=> $("fontModal").classList.remove("show");
$("fontModal").onclick=e=>{if(e.target===$("fontModal"))$("fontModal").classList.remove("show");}

const now=new Date();
const weekdays=["日","一","二","三","四","五","六"];
$("dateText").textContent=`${now.getMonth()+1}月${now.getDate()}日 週${weekdays[now.getDay()]}`;
applyFont(localStorage.getItem("workflow_font_size")||"normal");
render();
</script>
</body>
</html>
